[package]
name = "games-gallery"
version = "0.1.0"
description = "Catalog and launcher for PC and console game libraries, with emulator management"
edition = "2021"

[lib]
name = "games_gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
