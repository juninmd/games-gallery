name: release

# Builds the Tauri 2 installers (Windows, macOS, Linux).
# - Called by auto-release.yml with a draft release id: stamps the release version into the checkout,
#   builds, and attaches the installers to that release. With the signing key configured it also attaches
#   the signed updater artifacts and latest.json, which is what installed apps update from.
# - Manual runs and PRs touching the packaging only upload the bundles as workflow artifacts.
on:
  workflow_call:
    inputs:
      version:
        description: "Release version without the v prefix, e.g. 1.2.0"
        required: true
        type: string
      release-id:
        description: "Id of the draft GitHub release the bundles are attached to"
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/release.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release-id }}
  # A release build is never cancelled by a newer push: auto-release.yml queues runs instead.
  cancel-in-progress: ${{ inputs.release-id == '' }}

jobs:
  bundle:
    name: bundle (${{ matrix.label }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-2022
            args: ""
          - label: macos-arm64
            os: macos-15
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - label: macos-x64
            os: macos-15
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - label: linux-x64
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}
      - name: Stamp the release version
        if: inputs.release-id != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/stamp.mjs "$VERSION"
      - run: pnpm install --frozen-lockfile
      # Signed updates need the private key (secret) and its public half (repository variable). The
      # public key and the update endpoint are merged into the Tauri config of this build only.
      - name: Configure signed updates
        id: updater
        if: inputs.release-id != ''
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$PUBKEY" ] && [ -n "$PRIVATE_KEY" ]; then
            node -e 'require("fs").writeFileSync("src-tauri/tauri.updater.conf.json", JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.PUBKEY, endpoints: ["https://github.com/" + process.env.REPO + "/releases/latest/download/latest.json"] } } }))'
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Atualizações assinadas desligadas: defina o secret TAURI_SIGNING_PRIVATE_KEY e a variável TAURI_UPDATER_PUBKEY."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build bundles
        if: inputs.release-id == ''
        run: pnpm tauri build ${{ matrix.args }}
      - name: Build and attach to the release
        if: inputs.release-id != ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ inputs.release-id }}
          includeUpdaterJson: ${{ steps.updater.outputs.enabled == 'true' }}
          args: ${{ matrix.args }} ${{ steps.updater.outputs.enabled == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
      - uses: actions/upload-artifact@v7
        if: inputs.release-id == ''
        with:
          name: games-gallery-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 7
